</style><style>html{-webkit-text-size-adjust:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style></head><body><style>
/* Layout: sidebar alur kerja (1–6) + area kerja; tiap modul = form input → tabel otomatis → grafik segmentasi */
:root{
  --bg:#F4F6F8; --surface:#FFFFFF; --sunk:#EBEFF3; --line:#D9DFE6;
  --ink:#14202B; --muted:#5B6874; --accent:#0E7C6B; --accent-ink:#FFFFFF; --accent-soft:#DDF1EC;
  --good:#1F8A4C; --good-soft:#DCF3E4; --warn:#B26B00; --warn-soft:#FCEFD6; --bad:#C2362B; --bad-soft:#FBE3E0;
  --c1:#0E7C6B; --c2:#3F5BD8; --c3:#D98A12; --c4:#D14A6B; --c5:#2B9BC8; --c6:#7A9A1E; --c7:#7B6CB8; --c8:#8C96A0;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F161C; --surface:#172129; --sunk:#111A21; --line:#2A3742;
  --ink:#E6ECF1; --muted:#97A5B1; --accent:#3CC2A6; --accent-ink:#06231D; --accent-soft:#16352F;
  --good:#5BCB86; --good-soft:#163323; --warn:#E9B04F; --warn-soft:#3A2B10; --bad:#F07A6E; --bad-soft:#3D1D1A;
  --c1:#3CC2A6; --c2:#7F96FF; --c3:#F0B04A; --c4:#F07C98; --c5:#5BC2EA; --c6:#A9C94A; --c7:#AFA2F0; --c8:#8996A2;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F161C; --surface:#172129; --sunk:#111A21; --line:#2A3742;
  --ink:#E6ECF1; --muted:#97A5B1; --accent:#3CC2A6; --accent-ink:#06231D; --accent-soft:#16352F;
  --good:#5BCB86; --good-soft:#163323; --warn:#E9B04F; --warn-soft:#3A2B10; --bad:#F07A6E; --bad-soft:#3D1D1A;
  --c1:#3CC2A6; --c2:#7F96FF; --c3:#F0B04A; --c4:#F07C98; --c5:#5BC2EA; --c6:#A9C94A; --c7:#AFA2F0; --c8:#8996A2;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.6rem}h2{font-size:1.25rem}h3{font-size:1rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
nav.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;display:flex;flex-direction:column;gap:4px}
.brandmark{font-family:var(--f-display);font-weight:700;font-size:1.05rem;line-height:1.2;padding:0 8px 14px}
.brandmark small{display:block;font:500 .72rem var(--f-body);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.navlink{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500}
.navlink .n{font:500 .72rem var(--f-mono);width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:var(--sunk);color:var(--muted);flex:none}
.navlink:hover{background:var(--sunk)}
.navlink[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.navlink[aria-current="page"] .n{background:var(--accent);color:var(--accent-ink)}
.navsep{height:1px;background:var(--line);margin:8px 6px}
.side .foot{margin-top:auto;font-size:.75rem;color:var(--muted);padding:8px}
main{padding-block:24px 64px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));min-width:0;display:flex;flex-direction:column;gap:20px}
.head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.head p{margin:4px 0 0;color:var(--muted);max-width:68ch}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar select{width:auto;max-width:100%}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel>h3{margin-bottom:12px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.eyebrow{font:600 .7rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;min-width:0}
.kpi .v{font:600 1.35rem var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:.75rem;color:var(--muted)}
.kstack{display:grid;gap:10px}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:.8rem}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted);font-weight:500;min-width:0}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.form .wide{grid-column:span 2}
.form .full{grid-column:1/-1}
@media (max-width:520px){.form .wide{grid-column:1/-1}}
.formbar{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
details.add>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:600;font-size:1rem}
details.add>summary::-webkit-details-marker{display:none}
details.add>summary::before{content:"+";width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font:600 1rem var(--f-mono)}
details.add[open]>summary::before{content:"–"}
details.add[open]>summary{margin-bottom:14px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;max-height:560px;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-size:.82rem}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}
td.wrap{white-space:normal;min-width:180px;max-width:320px}
th{background:var(--sunk);font-weight:600;position:sticky;top:0;z-index:1;font-size:.75rem}
th.auto{color:var(--accent)}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
td.auto{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
tr:hover td{background:var(--sunk)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.72rem;font-weight:600;background:var(--sunk);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.ex{background:var(--warn-soft);color:var(--warn);font-size:.65rem}
.chart{position:relative;height:260px}
.chart.tall{height:320px}
.note{font-size:.78rem;color:var(--muted)}
.banner{border:1px dashed var(--line);border-radius:8px;padding:10px 14px;font-size:.82rem;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.banner.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.insights{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.insights li{padding:10px 12px;border-radius:8px;background:var(--sunk);font-size:.86rem}
.insights b{font-weight:600}
.empty{padding:28px;text-align:center;color:var(--muted)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--line);gap:1px}
.cal .dh{background:var(--sunk);padding:6px 8px;font:600 .7rem var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cal .dh.we{color:var(--bad)}
.cal .day{background:var(--surface);min-height:118px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cal .day.out{background:var(--sunk);opacity:.55}
.cal .day.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .dn{font:600 .8rem var(--f-mono);display:flex;justify-content:space-between}
.chip{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--c1);background:var(--sunk);padding:3px 6px;border-radius:4px;font-size:.72rem;line-height:1.3;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip[data-p="TikTok"]{border-left-color:var(--c4)}
.chip .st{font-size:.62rem;color:var(--muted);display:block}
.agenda{display:none}
@media (max-width:700px){.cal{display:none}.agenda{display:grid;gap:8px}}
.agenda .ad{display:grid;grid-template-columns:56px 1fr;gap:10px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.agenda .ad .d{font:600 .9rem var(--f-mono);color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.75rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.brief dl{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 14px;margin:0}
.brief dt{color:var(--muted);font-size:.8rem}
.brief dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}
@media (max-width:520px){.brief dl{grid-template-columns:1fr}.brief dt{margin-top:6px}}
.swot{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.swot label{font-weight:600}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:.85rem;z-index:20;max-width:min(360px,calc(100% - 32px))}
.ct td,.ct th{text-align:center}
.ct td.h{font-family:var(--f-mono)}
.side .foot select{margin-top:4px}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  nav.side{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;height:auto;flex-direction:row;overflow-x:auto;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid var(--line);gap:4px}
  .brandmark,.navsep,.side .foot{display:none}
  .navlink{flex:none;padding:6px 10px}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function calcPost(p){
  const eng = N(p.likes) + N(p.comments) + N(p.shares) + N(p.saves);
  const er = div(eng, p.reach), b = cfg().bench[p.platform];
  const label = !N(p.reach) ? "-" : !b ? "Cek platform" : er >= b.hi ? "Tinggi" : er < b.lo ? "Rendah" : "Sedang";
  return {...p, eng, er, erV: div(eng, p.views), saveRate: div(p.saves, p.reach), shareRate: div(p.shares, p.reach), label};
}
function calcAd(a){
  const t = cfg().targets;
  const r = {...a, freq: div(a.impr, a.reach), cpm: div(a.spend, a.impr) * 1000, ctr: div(a.clicks, a.impr), cpc: div(a.spend, a.clicks),
    cpr: div(a.spend, a.results), cvr: div(a.purchases, a.clicks), cpa: div(a.spend, a.purchases), roas: div(a.revenue, a.spend)};
  let e = "Isi objective";
  if (a.objective === "Sales") e = r.roas >= t.roas ? "Scale Up" : r.roas >= 1 ? "Optimasi" : "Stop/Evaluasi";
  else if (a.objective === "Leads" || a.objective === "Engagement") e = !N(a.results) ? "Stop/Evaluasi" : r.cpr <= t.cpl ? "Scale Up" : r.cpr <= t.cpl * 1.5 ? "Optimasi" : "Stop/Evaluasi";
  else if (a.objective === "Awareness") e = r.cpm <= t.cpm ? "Scale Up" : r.cpm <= t.cpm * 1.5 ? "Optimasi" : "Stop/Evaluasi";
  else if (a.objective === "Traffic") e = (r.cpc <= t.cpc && r.ctr >= t.ctr) ? "Scale Up" : r.cpc <= t.cpc * 1.5 ? "Optimasi" : "Stop/Evaluasi";
  r.eval = e; return r;
}
function calcSeg(s){ const w = cfg().weights; return {...s, score: N(s.ukuran)*w.ukuran + N(s.dayaBeli)*w.dayaBeli + N(s.kesesuaian)*w.kesesuaian + N(s.akses)*w.akses + N(s.kompetisi)*w.kompetisi}; }

  if (P.length) {
    const g = group(P, r => r.pilar); let best = null, bv = -1, worst = null, wv = 9;
    g.forEach((v, k) => { const e = div(sum(v,"eng"), sum(v,"reach")); if (v.length >= 2 && e > bv) { bv = e; best = k; } if (v.length >= 2 && e < wv) { wv = e; worst = k; } });
    if (best) out.push(`Pilar <b>${esc(best)}</b> paling engaging (ER ${fPct(bv)}). Tambah porsinya di content plan berikutnya.`);
    if (worst && worst !== best) out.push(`Pilar <b>${esc(worst)}</b> ER-nya terendah (${fPct(wv)}). Coba ganti hook atau format.`);
    const gf = group(P, r => r.format); let bf = null, bfv = -1; gf.forEach((v,k) => { const e = div(sum(v,"eng"), sum(v,"reach")); if (v.length >= 2 && e > bfv) { bfv = e; bf = k; } });
    if (bf) out.push(`Format terbaik: <b>${esc(bf)}</b> (ER ${fPct(bfv)}).`);
    const lo = P.filter(p => p.label === "Rendah").length; if (lo) out.push(`${lo} dari ${P.length} postingan di bawah benchmark ER — cek di Report Sosmed.`);
  }
  if (A.length) {
    const sales = A.filter(a => a.objective === "Sales"); if (sales.length) { const r = div(sum(sales,"revenue"), sum(sales,"spend")); out.push(`ROAS campaign Sales ${fX(r)} — ${r >= cfg().targets.roas ? "di atas target, layak di-scale." : "di bawah target " + fX(cfg().targets.roas) + ", optimasi audiens/kreatif."}`); }
    const gu = group(A.filter(a => N(a.purchases)), r => r.usia); let bu = null, buv = Infinity; gu.forEach((v,k) => { const c = div(sum(v,"spend"), sum(v,"purchases")); if (c < buv) { buv = c; bu = k; } });
    if (bu) out.push(`Usia <b>${esc(bu)}</b> punya CPA terendah (${fRp(buv)}). Prioritaskan budget ke segmen ini.`);
    const stop = A.filter(a => a.eval === "Stop/Evaluasi").length; if (stop) out.push(`${stop} ad set berstatus <b>Stop/Evaluasi</b> — hentikan atau ganti kreatif.`);
  }
  if (C.length) {
    const today = new Date(); today.setHours(0,0,0,0);
    const risk = C.filter(c => { const d = pd(c.tanggal); const dd = (d - today) / 864e5; return dd >= 0 && dd <= 3 && !["Approved","Terjadwal","Posted","Batal"].includes(c.status); }).length;
    if (risk) out.push(`<b>${risk} konten</b> tayang ≤3 hari lagi tapi belum Approved. Cek kalender.`);
    const gF = group(C, r => r.funnel); const top = [...gF.entries()].sort((a,b)=>b[1].length-a[1].length)[0];
    if (top) out.push(`Content plan didominasi <b>${esc(top[0])}</b> (${fPct(div(top[1].length, C.length),0)}). Pastikan funnel seimbang.`);
  }
  return out.slice(0, 7);
}

function surveyInsights(R){
  const n = R.length; if (!n) return [];
  const topOf = (key) => { const g = group(R, r => r[key]); const e = [...g.entries()].sort((a,b)=>b[1].length-a[1].length)[0]; return e ? [e[0], div(e[1].length, n)] : null; };
  const out = []; let t;
  if ((t = topOf("usia"))) out.push(`Usia dominan <b>${esc(t[0])}</b> (${fPct(t[1],0)}) — jadikan persona utama konten.`);
  if ((t = topOf("platform"))) out.push(`Platform utama <b>${esc(t[0])}</b> (${fPct(t[1],0)}) — prioritaskan frekuensi posting & budget di sini.`);
  if ((t = topOf("faktor"))) out.push(`Faktor beli utama <b>${esc(t[0])}</b> (${fPct(t[1],0)}) — angkat sebagai key message.`);
  if ((t = topOf("gender"))) out.push(`Gender dominan <b>${esc(t[0])}</b> (${fPct(t[1],0)}).`);
  const aw = div(R.filter(r=>r.kenal==="Ya").length, n); out.push(`Brand awareness ${fPct(aw,0)} → ${aw < 0.5 ? "perbanyak konten Awareness (TOFU) & reach ads." : "dorong konten Conversion (BOFU)."}`);
  const hi = R.filter(r => N(r.minat) >= 4); if (hi.length) { const g = group(hi, r => r.usia); const e = [...g.entries()].sort((a,b)=>b[1].length-a[1].length)[0]; out.push(`Minat beli tinggi (skor 4–5) paling banyak di usia <b>${esc(e[0])}</b>: ${e[1].length} dari ${hi.length} responden.`); }
  return out;
}
